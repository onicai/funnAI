# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.2.0/docs/schemas/icp-yaml-schema.json
#
# Root funnAI project.
#
# Deliberately lean: it declares ONLY the Svelte asset canister.
#
# Every backend canister belongs to its own project -- src/funnai_backend/, PoAIW/src/Api/,
# PoAIW/src/GameState/, PoAIW/src/mAIner/ and so on -- and each project owns its own
# canister-id store. Declaring them here as well would create a second store for the same
# canisters, and two stores for one canister drift apart. So the frontend reads their ids
# from the owning project's .icp/data/mappings/<env>.ids.json (see vite.config.ts), which
# keeps a single source of truth.
#
# The system canisters the frontend talks to need no declaration either:
#   - internet-identity (rdmx6-jaaaa-aaaaa-aaadq-cai) and cycles-ledger
#     (um5iw-rqaaa-aaaaq-qaaba-cai) are fixed mainnet principals; nothing here deploys them
#   - locally, `ii: true` below serves Internet Identity from the managed network

canisters:
  - name: funnai_frontend
    recipe:
      type: '@dfinity/asset-canister@v2.2.1'
      configuration:
        # `npm run build` output. Must contain .ic-assets.json5 -- note the json5
        # suffix, which is the only name the asset-canister recipe reads.
        dir: dist

networks:
  # A project-local replica, started with `icp network start`. `port: 0` lets the OS pick a
  # free ephemeral port, so this never collides with the canister projects' own networks.
  # The port changes on every start: never hardcode it, read it back with
  # `icp network status -e local --json` (which is what vite.config.ts does).
  - name: local
    mode: managed
    gateway:
      port: 0
    # Serves a local Internet Identity at http://id.ai.localhost:<port>/authorize, so
    # sign-in works locally without deploying anything.
    ii: true

environments:
  # An environment is a named set of canister ids on a network. The three mainnet
  # environments all run on the `ic` network and differ only in which ids they address;
  # each has its own .icp/data/mappings/<env>.ids.json.
  # `prd` is this project's production environment.
  - name: local
    network: local
  - name: prd
    network: ic
  - name: testing
    network: ic
  - name: development
    network: ic
