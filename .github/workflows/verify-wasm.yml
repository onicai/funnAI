name: verify-wasm

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to verify against"
        type: choice
        options:
          - prd
          - testing
          - development
        default: prd

env:
  # Keep in sync with the x-versions block in src/funnai_backend/docker/docker-compose.yml.
  ICP_VERSION: "1.2.0"
  MOPS_VERSION: "2.13.2"
  MOC_VERSION: "1.4.1"
  DO_NOT_TRACK: "1"

jobs:
  verify-wasm:
    name: verify-wasm ${{ matrix.canister }} (${{ inputs.network }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - canister: funnai_backend
            canister_name: funnai_backend

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The icp-cli binary links against libdbus/libssl; without them it fails at startup
      # with "libdbus-1.so.3: cannot open shared object file".
      - name: install icp-cli system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-3 libssl3 ca-certificates

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install icp-cli
        run: npm install -g "@icp-sdk/icp-cli@$ICP_VERSION" "@icp-sdk/ic-wasm"

      # No identity is needed: `icp canister status <id> -n ic -p` reads the public state
      # tree, so the hash lookup works without being a controller.

      - name: versions
        run: |
          echo "Runner OS   : $RUNNER_OS"
          echo "Architecture: $(uname -m)"
          echo "OS version  : $(lsb_release -d 2>/dev/null | cut -f2)"
          echo "icp version : $(icp --version)"
          echo "Docker      : $(docker --version)"

      - name: build Docker base image
        working-directory: src/${{ matrix.canister }}
        run: make docker-build-base

      - name: build wasm with Docker
        working-directory: src/${{ matrix.canister }}
        run: make docker-build-wasm

      # EXPECTED TO FAIL until the canister is redeployed with an icp-built wasm: the
      # dfx -> icp-cli migration changed the build chain, so the hash moved. Redeploying
      # is a separate project -- see WASM-HASHES.md.
      - name: verify wasm hash matches deployed canister
        working-directory: src/${{ matrix.canister }}
        run: make docker-verify-wasm VERIFY_NETWORK=${{ inputs.network }}
