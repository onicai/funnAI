name: cicd-ubuntu

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cicd-ubuntu.yml"
      - ".github/workflows/trigger.txt"
      # Keep in sync with matrix.canister below
      - "src/funnai_backend/**"
      - "src/docker/**"

env:
  # Keep in sync with the x-versions block in src/funnai_backend/docker/docker-compose.yml.
  ICP_VERSION: "1.2.0"
  MOPS_VERSION: "2.13.2"
  MOC_VERSION: "1.4.1"
  # `icp network start` downloads the network-launcher through the GitHub API.
  # Unauthenticated that is 60 requests/hour shared across ALL GitHub-hosted runners.
  ICP_CLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DO_NOT_TRACK: "1"

jobs:
  reproducible-build:
    name: reproducible-build ${{ matrix.canister }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with on.push.paths above
        include:
          - canister: funnai_backend
            canister_name: funnai_backend

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: docker versions
        run: |
          echo "Runner OS   : $RUNNER_OS"
          echo "Architecture: $(uname -m)"
          echo "OS version  : $(lsb_release -d 2>/dev/null | cut -f2)"
          echo "Docker      : $(docker --version)"

      - name: build Docker base image
        working-directory: src/${{ matrix.canister }}
        run: make docker-build-base

      - name: build wasm with Docker (reproducible build)
        working-directory: src/${{ matrix.canister }}
        run: make docker-build-wasm

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Node >= 22 is required by icp-cli and the official canister recipes.
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The icp-cli binary links against libdbus/libssl; without them it fails at startup
      # with "libdbus-1.so.3: cannot open shared object file".
      - name: install icp-cli system dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-3 libssl3 ca-certificates

      - name: install icp-cli, ic-wasm and mops
        run: |
          set -euo pipefail
          npm install -g "@icp-sdk/icp-cli@$ICP_VERSION" "@icp-sdk/ic-wasm" "ic-mops@$MOPS_VERSION"

      # Unlike dfx, icp-cli does not create a `default` identity for you, and icpp-pro's
      # pytest fixtures need one. `--storage plaintext` is required: a keyring identity
      # makes `icp identity export` prompt for a password and hang the run.
      - name: create default identity
        run: |
          icp identity new default --storage plaintext 2>/dev/null || true
          icp identity default default

      - name: install python dependencies
        run: |
          set -euo pipefail
          pip install --upgrade pip
          pip install "icpp-pro>=5.6.0"

      - name: smoketest versions
        run: |
          echo "icp version   : $(icp --version)"
          echo "mops version  : $(mops --version)"
          echo "pip version   : $(pip --version)"
          echo "python version: $(python --version)"
          echo "pytest version: $(pytest --version)"

      - name: smoketest ${{ matrix.canister }} canister
        working-directory: src/${{ matrix.canister }}
        run: |
          set -euo pipefail
          mops toolchain use moc "$MOC_VERSION"
          mops install
          make smoketest
