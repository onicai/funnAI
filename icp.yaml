# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.2.0/docs/schemas/icp-yaml-schema.json
#
# Root funnAI project. Replaces the legacy `dfx.json`, because dfx is deprecated.
#
# Deliberately lean: this project owns ONLY the Svelte asset canister.
#
# The old dfx.json also re-declared funnai_backend, game_state_canister, api_canister and
# mainer_ctrlb_canister, which already belong to their own projects (src/funnai_backend/,
# PoAIW/src/Api/, PoAIW/src/GameState/, PoAIW/src/mAIner/). Under icp-cli that would mean a
# SECOND canister-id store for the same canisters -- exactly how ids drift apart. It
# already had: the two stores disagreed about api_canister on `development`.
# So the frontend now reads those ids from the owning project's
# .icp/data/mappings/<env>.ids.json (see vite.config.ts), and there is one source of truth.
#
# `dfx deps pull` has no icp-cli equivalent and needs none:
#   - internet-identity (rdmx6-jaaaa-aaaaa-aaadq-cai) and cycles-ledger
#     (um5iw-rqaaa-aaaaq-qaaba-cai) are fixed mainnet principals; nothing here deploys them
#   - locally, `ii: true` below serves Internet Identity from the managed network

canisters:
  - name: funnai_frontend
    recipe:
      type: '@dfinity/asset-canister@v2.2.1'
      configuration:
        # `npm run build` output. Must contain .ic-assets.json5 (note the json5 suffix --
        # the recipe does not read the old .ic-assets.json name).
        dir: dist

networks:
  # A project-local replica, started with `icp network start`. `port: 0` lets the OS pick a
  # free ephemeral port, so this never collides with the canister projects' own networks.
  # The port changes on every start: never hardcode it, read it back with
  # `icp network status -e local --json` (which is what vite.config.ts does).
  - name: local
    mode: managed
    gateway:
      port: 0
    # Serves a local Internet Identity at http://id.ai.localhost:<port>/authorize,
    # replacing the `dfx deps pull` of the II canister.
    ii: true

environments:
  # These were dfx "networks" that ALL pointed at https://icp0.io, i.e. never separate
  # networks -- only separate canister-id namespaces, which is what an icp environment is.
  # `prd` is this project's mainnet convention.
  - name: local
    network: local
  - name: prd
    network: ic
  - name: testing
    network: ic
  - name: development
    network: ic
  - name: demo
    network: ic
  - name: backup
    network: ic
