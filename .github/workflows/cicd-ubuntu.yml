name: cicd-ubuntu

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/cicd-ubuntu.yml"
      - ".github/workflows/trigger.txt"
      # Keep in sync with matrix.canister below
      - "src/funnai_backend/**"
      - "src/docker/**"
      # Frontend reproducible build
      - "src/funnai_frontend/**"
      - "src/declarations/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "svelte.config.js"
      - "tsconfig.json"
      - "postcss.config.cjs"
      - "index.html"
      - "canister_ids.json"
      - "dfx.json"
      - "scripts/build-frontend.sh"
      - ".dockerignore"

env:
  DFX_VERSION: "0.29.2"
  DFX_WARNING: "-mainnet_plaintext_identity"

jobs:
  reproducible-build:
    name: reproducible-build ${{ matrix.canister }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with on.push.paths above
        include:
          - canister: funnai_backend
            canister_name: funnai_backend

    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: docker versions
        run: |
          echo "Runner OS   : $RUNNER_OS"
          echo "Architecture: $(uname -m)"
          echo "OS version  : $(lsb_release -d 2>/dev/null | cut -f2)"
          echo "Docker      : $(docker --version)"

      - name: build Docker base image
        working-directory: src/${{ matrix.canister }}
        run: make docker-build-base

      - name: build wasm with Docker (reproducible build)
        working-directory: src/${{ matrix.canister }}
        run: make docker-build-wasm

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Node is required for mops install
      - name: setup node
        uses: actions/setup-node@v4

      - name: install dfx
        run: |
          set -euo pipefail
          DFXVM_INIT_YES=true sh -ci "$(curl -fsSL https://sdk.dfinity.org/install.sh)"
          source "$HOME/.local/share/dfx/env"
          echo "$HOME/.local/share/dfx/bin" >> $GITHUB_PATH
          dfxvm default $DFX_VERSION

      - name: install python dependencies
        run: |
          set -euo pipefail
          pip install --upgrade pip
          # Cap icpp-pro below 5.5.0, which switched the smoketest framework from dfx
          # to icp-cli. This job installs dfx (not icp-cli) and `make smoketest` shells
          # out to `dfx identity get-principal`, so 5.5.0+ dies before the first test
          # with "no test identity configured".
          # KEEP IN SYNC with PoAIW/requirements.txt and
          # PoAIW/llms/llama_cpp_canister/requirements.txt. Lift as part of the
          # dfx -> icp-cli migration.
          pip install 'icpp-pro>=5.3.1,<5.5.0'

      - name: install mops to manage motoko dependencies
        run: npm install -g ic-mops

      - name: smoketest versions
        run: |
          echo "dfx version   : $(dfx --version)"
          echo "pip version   : $(pip --version)"
          echo "python version: $(python --version)"
          echo "pytest version: $(pytest --version)"

      - name: smoketest ${{ matrix.canister }} canister
        working-directory: src/${{ matrix.canister }}
        run: |
          set -euo pipefail
          mops install
          make smoketest

  reproducible-build-frontend:
    name: reproducible-build funnai_frontend
    runs-on: ubuntu-22.04
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: docker versions
        run: |
          echo "Runner OS   : $RUNNER_OS"
          echo "Architecture: $(uname -m)"
          echo "OS version  : $(lsb_release -d 2>/dev/null | cut -f2)"
          echo "Docker      : $(docker --version)"

      - name: build frontend with Docker (reproducible build)
        working-directory: src/funnai_frontend
        run: make docker-build-frontend NETWORK=prd

      - name: print fingerprint
        run: |
          set -euo pipefail
          echo "fingerprint=$(cat src/funnai_frontend/out/dist.fingerprint)"
          cat src/funnai_frontend/out/versions.txt
          wc -l src/funnai_frontend/out/dist.sha256

      - name: upload frontend build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: funnai-frontend-dist
          path: |
            src/funnai_frontend/out/dist.fingerprint
            src/funnai_frontend/out/dist.sha256
            src/funnai_frontend/out/assets.tar.xz
            src/funnai_frontend/out/versions.txt
          retention-days: 14
